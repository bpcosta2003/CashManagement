<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand-light.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5a2e3f" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0708" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Controle de Caixa" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Controle de Caixa — registro e análise financeira do seu negócio</title>
    <meta
      name="description"
      content="Fecha o caixa do mês em 1 minuto, no celular. Desconta taxa, custo e repasse e mostra seu líquido real na hora. Grátis pra começar, sem cartão, funciona offline."
    />

    <!-- Open Graph / link preview (WhatsApp, Instagram, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Controle de Caixa" />
    <meta property="og:url" content="https://mycashmanagement.app/" />
    <meta
      property="og:title"
      content="Saiba quanto sobrou antes de fechar a porta."
    />
    <meta
      property="og:description"
      content="Fecha o caixa do mês em 1 minuto, no celular. Desconta taxa, custo e repasse e mostra seu líquido real. Grátis pra começar, sem cartão, funciona offline."
    />
    <meta property="og:image" content="https://mycashmanagement.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Controle de Caixa — saiba quanto sobrou antes de fechar a porta." />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Saiba quanto sobrou antes de fechar a porta." />
    <meta
      name="twitter:description"
      content="Fecha o caixa do mês em 1 minuto, no celular. Grátis pra começar, sem cartão, funciona offline."
    />
    <meta name="twitter:image" content="https://mycashmanagement.app/og-image.png" />
    <script>
      // Apply theme + accent before first paint to avoid FOUC.
      (function () {
        var ALLOWED_ACCENTS = ["bordo", "esmeralda", "indigo", "terracota", "ouro", "grafite", "oceano", "lavanda", "rosa", "cobalto", "salvia", "pessego"];
        var root = document.documentElement;
        try {
          var t = localStorage.getItem("controle-caixa:theme");
          if (t !== "light" && t !== "dark") t = "light";
          root.setAttribute("data-theme", t);
        } catch (e) {
          root.setAttribute("data-theme", "light");
        }
        try {
          var a = localStorage.getItem("controle-caixa:accent");
          if (a && ALLOWED_ACCENTS.indexOf(a) !== -1 && a !== "bordo") {
            root.setAttribute("data-accent", a);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
